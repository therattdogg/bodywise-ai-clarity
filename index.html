<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be Bodywise AI Clarity Engine</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>body{background:#f8fafc;color:#1e293b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}</style>
</head>
<body>
<div id="app"></div>
<script>
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const Wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const S={tab:'scan',consent:L('bw_c',false),scans:L('bw_s',[]),cur:null,cam:false,stream:null,err:'',typing:false,input:'',exp:null,ctx:{week:null,pending:null},
msgs:[{r:'a',t:"Hi, I'm the Be Bodywise Clinical Assistant. Tell me what you're noticing (breakouts, hair shedding, dryness, irritation) and which week of your routine you're in, and I'll guide you.",badge:'Informational only',chips:[{l:'Is this skin purging?',s:"I'm getting small pimples after starting my serum. Is this purging?"},{l:'Hair shedding more',s:'My hair shedding has increased since I started'},{l:'Burning and rash',s:'I have severe burning and a rash'}]}]};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I=(n,c='w-4 h-4')=>`<i data-lucide="${n}" class="${c}"></i>`;

/* ---------- SCANNER: real image analysis (Sobel edges + Laplacian sharpness) ---------- */
function analyze(src){
  const sw=src.videoWidth||src.naturalWidth,sh=src.videoHeight||src.naturalHeight,W=320,H=Math.max(60,Math.round(W*sh/sw));
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,W,H);
  const img=x.getImageData(0,0,W,H),d=img.data,g=new Float32Array(W*H);let bs=0;
  for(let i=0;i<W*H;i++){g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];bs+=g[i]}
  const bright=bs/(W*H),m=new Float32Array(W*H);let ls=0,ls2=0,ms=0,n=0;
  for(let y=1;y<H-1;y++)for(let xx=1;xx<W-1;xx++){const i=y*W+xx;
    const gx=-g[i-W-1]+g[i-W+1]-2*g[i-1]+2*g[i+1]-g[i+W-1]+g[i+W+1],gy=-g[i-W-1]-2*g[i-W]-g[i-W+1]+g[i+W-1]+2*g[i+W]+g[i+W+1];
    m[i]=Math.hypot(gx,gy);const l=g[i-1]+g[i+1]+g[i-W]+g[i+W]-4*g[i];ls+=l;ls2+=l*l;ms+=m[i];n++}
  const sharp=ls2/n-(ls/n)**2,mm=ms/n;let v=0;
  for(let y=1;y<H-1;y++)for(let xx=1;xx<W-1;xx++){const e=m[y*W+xx]-mm;v+=e*e}
  const thr=mm+Math.sqrt(v/n);let cnt=0;
  const t=document.createElement('canvas');t.width=140;t.height=Math.round(140*H/W);t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  const orig=c.toDataURL('image/jpeg',.8);
  for(let y=1;y<H-1;y++)for(let xx=1;xx<W-1;xx++){const i=y*W+xx;if(m[i]>thr){cnt++;d[i*4]=236;d[i*4+1]=72;d[i*4+2]=153}}
  x.putImageData(img,0,0);
  const warn=[];if(bright<30)warn.push('Image is very dark. Move to brighter, even lighting.');if(bright>235)warn.push('Image is overexposed. Reduce glare or direct light.');if(sharp<8)warn.push('Image looks blurry. Hold steady and retake for a reliable reading.');
  return{idx:+(cnt/n*100).toFixed(2),bright:Math.round(bright),sharp:+sharp.toFixed(1),warn,overlay:c.toDataURL('image/jpeg',.8),orig,thumb:t.toDataURL('image/jpeg',.7)};
}
function onFile(e){const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{S.cur=analyze(im);S.err='';render()};im.onerror=()=>{S.err='Could not read that image. Try a JPG or PNG.';render()};im.src=URL.createObjectURL(f)}
async function startCam(){try{S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});S.cam=true;S.err=''}catch(e){S.err='Camera unavailable or permission denied. Use "Upload photo" instead.'}render()}
function stopCam(){if(S.stream)S.stream.getTracks().forEach(t=>t.stop());S.stream=null;S.cam=false}
function snap(){const v=document.getElementById('v');S.cur=analyze(v);stopCam();render()}
function saveScan(){S.scans.push({ts:Date.now(),idx:S.cur.idx,thumb:S.cur.thumb,bright:S.cur.bright,sharp:S.cur.sharp});Wr('bw_s',S.scans);S.cur=null;render()}
const dlt=(a,b)=>((a-b)/b*100);
const fmt=d=>(d>=0?'+':'')+d.toFixed(1)+'%';

function scanner(){
  const base=S.scans[0],last=S.scans[S.scans.length-1];
  let box;
  if(S.cam)box=`<video id="v" playsinline muted class="w-full max-w-md rounded-xl bg-black mx-auto"></video><div class="flex gap-2 justify-center mt-3"><button onclick="snap()" class="bg-pink-600 hover:bg-pink-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl flex items-center gap-2">${I('camera')}Capture</button><button onclick="stopCam();render()" class="border border-slate-300 text-sm px-4 py-2.5 rounded-xl">Cancel</button></div>`;
  else if(S.cur){const c=S.cur;box=`<div class="grid sm:grid-cols-2 gap-3"><div><div class="text-xs font-semibold text-slate-500 mb-1">Your capture</div><img src="${c.orig}" class="w-full rounded-xl border border-slate-200"></div><div><div class="text-xs font-semibold text-pink-600 mb-1">Detected strand/texture edges</div><img src="${c.overlay}" class="w-full rounded-xl border-2 border-pink-400"></div></div>
  <div class="grid grid-cols-3 gap-3 mt-4 text-left"><div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><div class="text-[11px] text-slate-500">Edge Density Index</div><div class="text-xl font-extrabold">${c.idx}%</div></div><div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><div class="text-[11px] text-slate-500">Sharpness</div><div class="text-xl font-extrabold">${c.sharp}</div></div><div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><div class="text-[11px] text-slate-500">Brightness</div><div class="text-xl font-extrabold">${c.bright}/255</div></div></div>
  ${base?`<div class="mt-3 text-sm font-semibold ${c.idx>=base.idx?'text-emerald-600':'text-amber-600'}">${fmt(dlt(c.idx,base.idx))} vs your baseline (${base.idx}%)</div>`:`<div class="mt-3 text-sm text-slate-600">This will become your <b>baseline</b> scan once saved.</div>`}
  ${c.warn.map(w=>`<div class="mt-2 text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded-lg p-2">${I('alert-triangle','w-3.5 h-3.5 inline mr-1')}${w}</div>`).join('')}
  <div class="flex gap-2 mt-4"><button onclick="saveScan()" class="bg-pink-600 hover:bg-pink-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl">Save to my progress</button><button onclick="S.cur=null;render()" class="border border-slate-300 text-sm px-4 py-2.5 rounded-xl">Retake</button></div>`}
  else box=`<div class="py-6 space-y-4"><div class="w-16 h-16 bg-pink-50 text-pink-600 rounded-full flex items-center justify-center mx-auto">${I('camera','w-8 h-8')}</div><div><h3 class="font-semibold">Capture your scalp or skin area</h3><p class="text-xs text-slate-500 mt-1">Hold the camera 5 cm away in even light. Use the same distance and lighting every time.</p></div>
  <div class="flex flex-wrap gap-2 justify-center"><button onclick="startCam()" class="bg-pink-600 hover:bg-pink-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl flex items-center gap-2">${I('camera')}Use camera</button><label class="cursor-pointer border border-slate-300 bg-white text-sm font-semibold px-5 py-2.5 rounded-xl flex items-center gap-2">${I('upload')}Upload photo<input type="file" accept="image/*" capture="environment" class="hidden" onchange="onFile(event)"></label></div></div>`;
  const hist=S.scans.length?`<h3 class="font-bold text-sm mt-8 mb-3">Your progress timeline</h3>${S.scans.length>1?`<div class="grid grid-cols-2 gap-3 mb-3 bg-slate-50 border border-slate-200 rounded-xl p-3 text-center"><div><div class="text-xs font-semibold text-slate-500 mb-1">Baseline · ${new Date(base.ts).toLocaleDateString()}</div><img src="${base.thumb}" class="rounded-lg mx-auto"><div class="text-sm font-bold mt-1">${base.idx}%</div></div><div><div class="text-xs font-semibold text-pink-600 mb-1">Latest · ${new Date(last.ts).toLocaleDateString()}</div><img src="${last.thumb}" class="rounded-lg mx-auto border-2 border-pink-400"><div class="text-sm font-bold mt-1">${last.idx}% <span class="${last.idx>=base.idx?'text-emerald-600':'text-amber-600'}">(${fmt(dlt(last.idx,base.idx))})</span></div></div></div>`:''}
  <div class="space-y-2">${S.scans.map((s,i)=>`<div class="flex items-center gap-3 border border-slate-200 rounded-xl p-2 bg-white"><img src="${s.thumb}" class="w-14 h-14 object-cover rounded-lg"><div class="flex-1 text-sm"><div class="font-semibold">${i?'Scan '+(i+1):'Baseline'} · ${new Date(s.ts).toLocaleString()}</div><div class="text-xs text-slate-500">Index ${s.idx}% ${i?'· '+fmt(dlt(s.idx,base.idx))+' vs baseline':''}</div></div></div>`).join('')}</div>`:'';
  return `<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm"><h2 class="text-xl font-bold mb-1">AI Micro-Scanner</h2>
  <p class="text-slate-600 text-sm mb-4">Capture a real photo. The image is analysed in your browser using edge detection to estimate a relative density index, and checked for blur and lighting so results are comparable over time.</p>
  <div class="border-2 border-dashed border-slate-300 rounded-2xl p-4 text-center bg-slate-50">${box}</div>
  ${S.err?`<div class="mt-3 text-xs bg-red-50 border border-red-200 text-red-700 rounded-lg p-2">${S.err}</div>`:''}
  <div class="mt-3 text-[11px] text-slate-500 flex gap-2">${I('shield-check','w-4 h-4 text-emerald-600 shrink-0')}<span>Photos never leave your device. Analysis runs locally and only small thumbnails and numbers are stored in this browser. The index is a relative visual measure, not a clinical hair count.</span></div>${hist}</div>`;
}

/* ---------- ASSISTANT: context-aware triage engine ---------- */
const WK=[2,4,6,10].map(w=>({l:'Week '+w,s:'Week '+w}));
function reply(raw){
  const q=raw.toLowerCase(),c=S.ctx;
  const m=q.match(/week\s*(\d+)|(\d+)\s*(?:wk|week)s?/),mo=q.match(/(\d+)\s*months?/),dy=q.match(/day\s*(\d+)/);
  if(m)c.week=+(m[1]||m[2]);else if(mo)c.week=Math.round(+mo[1]*4.3);else if(dy)c.week=Math.ceil(+dy[1]/7);
  let it=null;
  if(/breath|throat|tongue|lips|face.*swell|swell.*face/.test(q))it='emergency';
  else if(/burn|blister|swell|swollen|hives|pus|bleed|fever|severe|spreading|rash|oozing|intense pain/.test(q))it='urgent';
  else if(/^(hi|hello|hey)\b/.test(q))it='hi';
  else if(/thank/.test(q))it='thanks';
  else if(/purg|acne|pimple|breakout|zits/.test(q))it='purge';
  else if(/shed|hair ?fall|falling|losing|loss/.test(q))it='shed';
  else if(/dry|flak|itch|redness|irritat|sting/.test(q))it='irr';
  else if(/pregnan|breastfeed|nursing/.test(q))it='preg';
  else if(/\bmiss|forgot|skip/.test(q))it='miss';
  else if(/scan|density|my progress/.test(q))it='scan';
  else if(/how (long|soon)|when will|results/.test(q))it='time';
  else if(/how (do|to)|apply|how much|how often|dose|dosage/.test(q))it='how';
  if(!it&&c.pending&&(m||mo||dy))it=c.pending;
  const w=c.week,last=S.scans[S.scans.length-1],base=S.scans[0];
  const scanNote=last&&base&&S.scans.length>1?` Your saved scans show an index change of ${fmt(dlt(last.idx,base.idx))} since baseline.`:'';
  const doc={l:'Talk to a doctor',s:'I think I need to see a doctor'};
  if((it==='purge'||it==='shed'||it==='irr')&&w==null&&it!=='irr'){c.pending=it;return{t:`Happy to help. Timing matters here, so which week of your routine are you in?`,badge:'Need one detail',chips:WK}}
  c.pending=null;
  switch(it){
  case'emergency':return{t:'Difficulty breathing or swelling of the face, lips or tongue can be a severe allergic reaction. Stop the product and seek emergency medical care right now. Do not wait for an online consultation.',badge:'Emergency: seek care now',tone:'red'};
  case'urgent':return{t:'Burning, blistering, spreading rash, swelling or oozing are not normal adjustment effects and may indicate contact dermatitis or a barrier reaction. Please:\n1. Stop the product now and rinse the area with cool water.\n2. Avoid other actives until it settles.\n3. Book a dermatologist consultation today, especially if it is spreading or painful.\nThis prototype cannot contact a doctor for you.',badge:'Urgent: stop and see a doctor',tone:'red',chips:[{l:'It was mild burning only',s:'Actually it is only mild stinging'}]};
  case'hi':return{t:'Hello! What would you like help with today: breakouts, hair shedding, dryness or irritation, or understanding your scan?',chips:[{l:'Skin purging?',s:'Is this skin purging?'},{l:'Hair shedding',s:'My hair is shedding'},{l:'My scan progress',s:'How is my scan progress?'}]};
  case'thanks':return{t:"You're welcome. If anything changes, especially burning, swelling or spreading redness, tell me straight away."};
  case'purge':{
    if(w<=1)return{t:`At week ${w} it is early. Mild breakouts can appear as actives speed up cell turnover, but this early it can also be irritation. Keep the routine gentle (one new active at a time) and watch whether breakouts are in your usual areas.`,badge:'Early phase'};
    if(w<=6)return{t:`At week ${w}, breakouts are consistent with skin purging, which typically appears in weeks 2 to 6 with actives like salicylic acid or retinoids. Signs it is purging: breakouts are in areas where you usually break out and individual spots clear faster than usual. Continue, use a gentle moisturiser and sunscreen, and expect improvement by weeks 6 to 8.\nIf you get burning, redness in new areas or spread beyond usual areas, that suggests irritation instead, so tell me.`,badge:'Expected purging phase',chips:[{l:'It is in new areas',s:'The pimples are in new areas and it burns'},{l:'Thanks',s:'Thanks'}]};
    if(w<=9)return{t:`At week ${w}, purging should be easing. If breakouts are not clearly fewer than a few weeks ago, consider reducing use to alternate days and check in with a dermatologist if it has not improved by week 10.`,badge:'Should be settling',chips:[doc]};
    return{t:`Breakouts continuing past week ${w} are unlikely to be purging. They may be irritation, a product that doesn't suit your skin, or an unrelated cause. I'd recommend a dermatologist review rather than continuing as is.`,badge:'Not typical purging',tone:'amber',chips:[doc]}}
  case'shed':{
    const sn=scanNote;
    if(w<=1)return{t:'Very early on, shedding is usually your existing cycle rather than the product. Keep a consistent routine and take a baseline scan so we can track change objectively.',badge:'Early phase',chips:[{l:'Open scanner',tab:'scan'}]};
    if(w<=6)return{t:`Increased shedding in weeks 2 to 6 is a recognised early response: weaker resting-phase hairs shed as follicles reset into new growth. It is not a reason to stop on its own.${sn}\nSee a doctor if you notice bald patches, scalp pain or itching, or shedding that keeps increasing after week 8.`,badge:'Expected shedding phase',chips:[{l:'Open scanner',tab:'scan'},{l:'It has a patchy pattern',s:'The hair loss is patchy with bald spots'}]};
    if(w<=12)return{t:`By week ${w} shedding should be tapering. If it is still heavy, check for other drivers such as low iron or vitamin D, thyroid problems, stress or recent illness. A blood test and dermatologist review is sensible.${sn}`,badge:'Should be tapering',tone:'amber',chips:[doc]};
    return{t:`Heavy shedding persisting past week ${w} should be evaluated by a doctor rather than waited out.${sn}`,badge:'Needs evaluation',tone:'amber',chips:[doc]}}
  case'irr':return{t:'Mild dryness, tightness or slight stinging is common in the first weeks. Cut back to every other night, apply on dry skin, add a fragrance-free moisturiser, and pause other actives like exfoliating acids. If it turns into burning, swelling or blisters, stop and see a doctor.',badge:'Mild irritation guidance',chips:[{l:'It is burning badly',s:'It is burning and the rash is spreading'}]};
  case'preg':return{t:'Many hair and skin actives, especially retinoids and oral treatments, are not recommended during pregnancy or breastfeeding. Please check with your doctor before using or continuing any product.',badge:'Ask your doctor first',tone:'amber',chips:[doc]};
  case'miss':return{t:'One missed application is fine. Skip it and carry on the next day without doubling up. Consistency over weeks matters more than any single day.'};
  case'time':return{t:'Hair and skin change slowly. Skin purging settles around weeks 4 to 8, reduced shedding often shows by weeks 8 to 12, and visible density gains typically take 3 to 6 months. The scanner helps you see small changes earlier.',chips:[{l:'Open scanner',tab:'scan'}]};
  case'how':return{t:'Follow the directions on your product label and your doctor\'s instructions, as dosing differs by product. In general: apply to clean, dry skin or scalp, use a small amount, and add one new active at a time. Which product are you using?'};
  case'scan':if(!last)return{t:'You have no saved scans yet. Take a baseline in the scanner, then repeat every 2 to 4 weeks under the same lighting and distance.',chips:[{l:'Open scanner',tab:'scan'}]};
    return{t:S.scans.length>1?`Your latest scan has an Edge Density Index of ${last.idx}%, ${fmt(dlt(last.idx,base.idx))} versus baseline (${base.idx}%). Small shifts can come from lighting or angle, so look at the trend across scans rather than one reading.`:`You have one saved scan (index ${last.idx}%), which is your baseline. Take another in 2 to 4 weeks under the same conditions to see change.`,badge:'From your scans',chips:[{l:'Open scanner',tab:'scan'}]};
  }
  return{t:"I want to make sure I give you the right guidance. Which of these is closest to what you're experiencing?",badge:'Clarifying',chips:[{l:'Breakouts / pimples',s:'I have breakouts'},{l:'Hair shedding',s:'My hair is shedding'},{l:'Dryness or stinging',s:'My skin is dry and stinging'},{l:'Burning / rash',s:'I have burning and a rash'}]};
}
function send(txt){const t=(txt||S.input).trim();if(!t||S.typing)return;S.msgs.forEach(m=>delete m.chips);S.msgs.push({r:'u',t});S.input='';S.typing=true;S.focus=true;render();
  setTimeout(()=>{S.msgs.push(Object.assign({r:'a'},reply(t)));S.typing=false;render()},700)}
function chip(i,j){const ch=S.msgs[i].chips[j];if(ch.tab){S.tab=ch.tab;render()}else send(ch.s)}
function chat(){return `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-[560px]"><div class="bg-slate-900 text-white p-4 flex items-center justify-between"><div class="flex items-center gap-2">${I('sparkles','w-5 h-5 text-pink-400')}<span class="font-bold text-sm">Clinical AI Assistant</span></div><span class="text-[11px] text-slate-300">Informational, not medical advice</span></div>
<div id="msgs" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50">${S.msgs.map((m,i)=>`<div class="flex flex-col ${m.r=='u'?'items-end':'items-start'}"><div class="max-w-md p-3.5 rounded-2xl text-sm whitespace-pre-line ${m.r=='u'?'bg-pink-600 text-white rounded-br-none':m.tone=='red'?'bg-red-50 text-red-900 border border-red-300 rounded-bl-none':'bg-white border border-slate-200 rounded-bl-none shadow-sm'}">${esc(m.t)}</div>${m.badge?`<span class="text-[10px] font-semibold px-2 py-0.5 rounded mt-1 ${m.tone=='red'?'bg-red-100 text-red-700':m.tone=='amber'?'bg-amber-100 text-amber-800':'bg-pink-100 text-pink-700'}">${m.badge}</span>`:''}${m.chips?`<div class="flex flex-wrap gap-2 mt-2">${m.chips.map((c,j)=>`<button onclick="chip(${i},${j})" class="text-xs bg-white border border-pink-300 text-pink-700 hover:bg-pink-50 px-3 py-1.5 rounded-full">${esc(c.l)}</button>`).join('')}</div>`:''}</div>`).join('')}${S.typing?'<div class="text-xs text-slate-400">Assistant is typing…</div>':''}</div>
<form onsubmit="event.preventDefault();send()" class="p-3 bg-white border-t border-slate-200 flex gap-2"><input id="ci" value="${esc(S.input)}" oninput="S.input=this.value" placeholder="Describe your symptoms and which week you're in…" class="flex-1 min-w-0 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-pink-600"><button class="bg-pink-600 hover:bg-pink-700 text-white px-5 py-2 rounded-xl font-semibold text-sm">Send</button></form></div>`}

/* ---------- PRIVACY ---------- */
function privacy(){return `<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm"><h2 class="text-xl font-bold mb-2">Privacy & Rights (DPDP Act 2023)</h2><p class="text-slate-600 text-sm mb-4">Photos are analysed on your device and never uploaded. Only small thumbnails and numeric scores are stored in this browser. You can export or erase them at any time (Sections 6 and 12).</p>
<div class="flex flex-wrap gap-2"><button onclick="S.exp=JSON.stringify({consent:S.consent,scans:S.scans.map(s=>({date:new Date(s.ts).toISOString(),edgeDensityIndex:s.idx,sharpness:s.sharp,brightness:s.bright})),chat:S.msgs.map(m=>({from:m.r,text:m.t}))},null,2);render()" class="border border-slate-300 text-sm font-semibold px-4 py-2 rounded-lg flex items-center gap-2">${I('download')}Export my data</button><button onclick="wipe()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-lg flex items-center gap-2">${I('trash-2')}Delete all my data</button></div>
${S.exp?`<pre class="mt-3 text-[11px] bg-slate-50 border border-slate-200 rounded-lg p-3 max-h-64 overflow-auto">${esc(S.exp)}</pre>`:''}${S.wiped?`<div class="mt-3 text-xs bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg p-2">All scans, chat history and consent have been erased from this browser.</div>`:''}</div>`}
function wipe(){stopCam();try{['bw_c','bw_s'].forEach(k=>localStorage.removeItem(k))}catch(e){}S.scans=[];S.cur=null;S.exp=null;S.consent=false;S.wiped=true;S.ctx={week:null,pending:null};S.msgs=S.msgs.slice(0,1);render()}
function accept(){S.consent=true;S.wiped=false;Wr('bw_c',true);render()}

const tabs=[['scan','AI Micro-Scanner','camera'],['chat','Clinical AI Assistant','message-square'],['privacy','Privacy & Rights','shield-check']];
function render(){const f=document.activeElement&&document.activeElement.id=='ci';
document.getElementById('app').innerHTML=`<header class="bg-white border-b border-slate-200 sticky top-0 z-40"><div class="max-w-3xl mx-auto px-4 py-3 flex flex-wrap gap-2 items-center justify-between"><div class="flex items-center gap-3"><div class="bg-pink-600 text-white px-3 py-2 rounded-xl font-bold tracking-wider text-sm">BE BODYWISE</div><span class="text-xs bg-pink-100 text-pink-700 font-semibold px-2.5 py-1 rounded-full border border-pink-200">AI Clarity Engine v2.5</span></div><div class="flex items-center gap-2 text-xs bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">${I('lock','w-3.5 h-3.5 text-emerald-600')}<span class="font-medium text-slate-700">DPDP Act 2023 Compliant</span></div></div>
