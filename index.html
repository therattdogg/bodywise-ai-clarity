<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be Bodywise AI Clarity Engine</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#f8fafc;color:#1e293b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const S={consent:false,modal:true,tab:'scanner',scanning:false,prog:0,img:null,res:null,deleted:false,exportJson:null,input:'',
chat:[{s:'ai',t:'Hello! I am your Be Bodywise Clinical AI Assistant. How is your current regimen feeling? You can report active symptoms, skin purging, or hair shedding.',b:'DPDP Encrypted'}]};
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I=(n,c='w-4 h-4')=>`<i data-lucide="${n}" class="${c}"></i>`;
const tabs=[['scanner','AI Micro-Scanner','camera'],['dashboard','Efficacy Analytics','activity'],['triage','Clinical AI Assistant','message-square'],['privacy','Privacy & Rights','shield-check']];
function scanImg(){let l='';for(let i=0;i<70;i++){const x=Math.random()*200,y=Math.random()*200,a=Math.random()*6.28;l+=`<line x1="${x}" y1="${y}" x2="${x+Math.cos(a)*14}" y2="${y+Math.sin(a)*14}" stroke="#3b2a22" stroke-width="1.4"/>`}
return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#e8c9b0"/>${l}</svg>`)}
function scanner(){return `<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm"><div class="max-w-2xl">
<h2 class="text-xl font-bold text-slate-900 mb-2">Sub-Visual Follicular & Skin Scanner</h2>
<p class="text-slate-600 text-sm mb-6">Biological recovery takes 90–120 days. Our edge computer vision algorithms analyze millimeter-level hair density (strands/cm²) and texture variations to verify micro-progress before it becomes visible.</p>
<div class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center bg-slate-50 flex flex-col items-center justify-center min-h-[280px]">
${S.scanning?`<div class="space-y-4 w-full max-w-xs">${I('refresh-cw','w-10 h-10 text-pink-600 animate-spin mx-auto')}<div class="text-sm font-semibold text-slate-700">Analyzing Follicular Spatial Density...</div><div class="w-full bg-slate-200 rounded-full h-2.5"><div class="bg-pink-600 h-2.5 rounded-full transition-all duration-300" style="width:${S.prog}%"></div></div><p class="text-xs text-slate-400">Applying UV Latent Alignment & LPIPS Texture Loss...</p></div>`
:S.img?`<div class="space-y-4"><img src="${S.img}" alt="Scalp Capture" class="w-48 h-48 object-cover rounded-xl border-2 border-pink-500 shadow-md mx-auto"><div class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium inline-block">Scan Verified & Processed</div><div class="text-xs text-slate-600"><div class="font-semibold text-slate-800">${S.res.status}</div>${S.res.stage} • ${S.res.d} strands/cm² (+${S.res.c}%)</div><div><button onclick="runScan()" class="text-xs text-pink-600 font-semibold underline">Scan again</button></div></div>`
:`<div class="space-y-4"><div class="w-16 h-16 bg-pink-50 text-pink-600 rounded-full flex items-center justify-center mx-auto">${I('camera','w-8 h-8')}</div><div><h3 class="font-semibold text-slate-800">Align Scalp or Facial Zone</h3><p class="text-xs text-slate-500 mt-1">Position macro camera 5cm from target skin area under clear lighting.</p></div><button onclick="runScan()" class="bg-pink-600 hover:bg-pink-700 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-md flex items-center space-x-2 mx-auto">${I('sparkles')}<span>Simulate Micro-Scan</span></button></div>`}
</div><div class="mt-4 flex items-center space-x-2 text-xs text-slate-500">${I('shield-check','w-4 h-4 text-emerald-600')}<span>Face landmarks automatically masked on client device prior to cloud analysis.</span></div></div></div>`}
function dash(){const m=(l,v,u,n,c)=>`<div class="bg-slate-50 p-4 rounded-xl border border-slate-200"><span class="text-xs font-medium text-slate-500">${l}</span><div class="flex items-baseline space-x-2 mt-1"><span class="text-2xl font-extrabold text-slate-900">${v}</span><span class="text-xs text-slate-500">${u}</span></div><div class="text-xs font-semibold ${c} mt-2">${n}</div></div>`;
return `<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm"><div class="flex flex-wrap gap-2 items-center justify-between mb-6"><div><h2 class="text-xl font-bold text-slate-900">Quantitative Progress Analytics</h2><p class="text-xs text-slate-500">Regimen: Hair Growth Serum (3% Redensyl + Procapil) • Day 28</p></div><span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold px-3 py-1 rounded-full flex items-center space-x-1">${I('check-circle-2','w-3.5 h-3.5')}<span>Efficacy Tracked On-Schedule</span></span></div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">${m('Spatial Hair Density',142,'strands/cm²','+8.4% vs Baseline (131 strands/cm²)','text-emerald-600')}${m('LPIPS Visual Variance','0.042','LPIPS Delta','Micro-Vellus Emergence Verified','text-emerald-600')}${m('Regimen Adherence Score','96%','','27 / 28 Daily Applications Logged','text-pink-600')}</div>
<h3 class="font-bold text-slate-800 mb-3 text-sm">Longitudinal Micro-Scan Comparison</h3><div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
<div class="text-center"><span class="text-xs font-semibold text-slate-500 mb-2 block">Day 1 Baseline Scan</span><div class="w-full h-36 bg-slate-300 rounded-lg flex items-center justify-center text-xs text-slate-600 font-mono px-2">Baseline Scan [131 strands/cm²]</div></div>
<div class="text-center"><span class="text-xs font-semibold text-pink-600 mb-2 block">Day 28 Follow-Up Scan</span><div class="w-full h-36 bg-pink-100 border-2 border-pink-400 rounded-lg flex items-center justify-center text-xs text-pink-800 font-mono font-semibold px-2">Current Scan [142 strands/cm²]</div></div></div></div>`}
function triage(){const chips=[["Is my skin purging?","I'm getting small pimples during week 2 of serum usage. Is this purging?"],["Increased hair shedding?","My hair shedding increased in week 3 of Redensyl. Should I stop?"],["Burning and rash?","I have severe burning and a rash after applying the serum."]];
return `<div class="space-y-6"><div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-[520px]"><div class="bg-slate-900 text-white p-4 flex items-center justify-between"><div class="flex items-center space-x-2">${I('sparkles','w-5 h-5 text-pink-400')}<span class="font-bold text-sm">Be Bodywise Clinical Triage Engine</span></div><span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full hidden sm:inline">RAG Medical Guardrails Active</span></div>
<div id="msgs" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50">${S.chat.map(m=>`<div class="flex flex-col ${m.s=='user'?'items-end':'items-start'}"><div class="max-w-md p-3.5 rounded-2xl text-sm ${m.s=='user'?'bg-pink-600 text-white rounded-br-none':'bg-white text-slate-800 border border-slate-200 rounded-bl-none shadow-sm'}">${esc(m.t)}</div>${m.b?`<span class="text-[10px] font-semibold px-2 py-0.5 rounded mt-1 ${m.b.includes('Urgent')?'bg-red-100 text-red-700':'bg-pink-100 text-pink-700'}">${m.b}</span>`:''}</div>`).join('')}</div>
<form onsubmit="sendChat(event)" class="p-3 bg-white border-t border-slate-200 flex space-x-2"><input id="ci" value="${esc(S.input)}" oninput="S.input=this.value" placeholder="Ask about skin purging, hair shedding, or dosage..." class="flex-1 min-w-0 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-pink-600"><button class="bg-pink-600 hover:bg-pink-700 text-white px-5 py-2 rounded-xl font-semibold text-sm">Send</button></form></div>
<div class="flex flex-wrap gap-2 text-xs"><span class="text-slate-500 font-medium self-center">Try asking:</span>${chips.map(c=>`<button onclick="S.input='${c[1].replace(/'/g,"\\'")}';render()" class="bg-white border border-slate-200 hover:border-pink-400 px-3 py-1.5 rounded-lg text-slate-700">"${c[0]}"</button>`).join('')}</div></div>`}
function privacy(){return `<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm"><h2 class="text-xl font-bold text-slate-900 mb-2">DPDP Act 2023 Privacy Portal</h2><p class="text-slate-600 text-sm mb-6">Under Sections 6 and 12 of the Digital Personal Data Protection Act 2023, you retain full rights over your biometric scans and personal health data.</p>
${S.deleted?`<div class="mb-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800 flex items-center space-x-2">${I('check-circle-2')}<span>Certificate of Data Destruction issued. Consent revoked; all visual scans, embeddings and health records purged.</span></div>`:''}
<div class="space-y-4"><div class="p-4 rounded-xl border border-slate-200 bg-slate-50"><div class="flex flex-wrap gap-3 items-center justify-between"><div><h3 class="font-semibold text-sm text-slate-800">Download Health Records</h3><p class="text-xs text-slate-500">Export structured JSON containing all scalp metrics and triage logs.</p></div><button onclick="exportRec()" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg flex items-center space-x-1.5">${I('download','w-3.5 h-3.5')}<span>Export Records</span></button></div>
${S.exportJson?`<pre class="mt-3 text-[11px] bg-white border border-slate-200 rounded-lg p-3 max-h-60 overflow-auto">${esc(S.exportJson)}</pre><button onclick="navigator.clipboard&&navigator.clipboard.writeText(S.exportJson)" class="mt-2 text-xs text-pink-600 font-semibold underline">Copy JSON</button>`:''}</div>
<div class="p-4 rounded-xl border border-red-200 bg-red-50 flex flex-wrap gap-3 items-center justify-between"><div><h3 class="font-semibold text-sm text-red-900">Revoke Consent & Cascade Delete</h3><p class="text-xs text-red-700">Permanently purge visual scans, embeddings, and telemetry across cloud buckets.</p></div><button onclick="del()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center space-x-1.5">${I('trash-2','w-3.5 h-3.5')}<span>Execute Cascade Erasure</span></button></div></div></div>`}
function modal(){return S.modal?`<div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200 space-y-4"><div class="flex items-center space-x-2 text-pink-600">${I('shield-check','w-6 h-6')}<h3 class="font-bold text-lg text-slate-900">DPDP Act 2023 Consent Notice</h3></div><p class="text-xs text-slate-600 leading-relaxed">Mosaic Wellness (Data Fiduciary) requests explicit consent to process your scalp/skin macro imagery and health log data solely for generating micro-density progress metrics and clinical triage.</p><div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-slate-700 font-medium space-y-1"><div class="flex items-center space-x-1">${I('check-circle-2','w-3.5 h-3.5 text-emerald-600')}<span>No bundled terms or pre-ticked consent boxes.</span></div><div class="flex items-center space-x-1">${I('check-circle-2','w-3.5 h-3.5 text-emerald-600')}<span>Edge-level metadata scrubbing before cloud storage.</span></div></div><button onclick="S.consent=true;S.modal=false;S.deleted=false;render()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-semibold text-sm py-2.5 rounded-xl shadow-md">Grant Explicit Opt-In</button></div></div>`:''}
function render(){const f=document.activeElement&&document.activeElement.id=='ci';
document.getElementById('app').innerHTML=`<div class="min-h-screen"><header class="bg-white border-b border-slate-200 sticky top-0 z-40"><div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap gap-2 items-center justify-between"><div class="flex items-center space-x-3"><div class="bg-pink-600 text-white p-2 rounded-xl font-bold tracking-wider text-sm">BE BODYWISE</div><span class="text-xs bg-pink-100 text-pink-700 font-semibold px-2.5 py-1 rounded-full border border-pink-200">AI Clarity Engine v2.4</span></div><div class="flex items-center space-x-2 text-xs bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">${I('lock','w-3.5 h-3.5 text-emerald-600')}<span class="font-medium text-slate-700">DPDP Act 2023 Compliant</span></div></div></header>
<nav class="bg-white border-b border-slate-200"><div class="max-w-5xl mx-auto px-4 flex space-x-6 text-sm font-medium overflow-x-auto whitespace-nowrap">${tabs.map(t=>`<button onclick="S.tab='${t[0]}';render()" class="py-3 border-b-2 flex items-center space-x-2 ${S.tab==t[0]?'border-pink-600 text-pink-600 font-semibold':'border-transparent text-slate-500 hover:text-slate-800'}">${I(t[2])}<span>${t[1]}</span></button>`).join('')}</div></nav>
<main class="max-w-5xl mx-auto px-4 py-8">${{scanner,dashboard:dash,triage,privacy}[S.tab]()}</main>${modal()}</div>`;
lucide.createIcons();const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;if(f||S.tab=='triage'&&S.focus){const c=document.getElementById('ci');if(c){c.focus();c.setSelectionRange(c.value.length,c.value.length)}}}
function runScan(){if(!S.consent){S.modal=true;return render()}
S.scanning=true;S.prog=15;render();const iv=setInterval(()=>{S.prog=Math.min(100,S.prog+20);if(S.prog>=95)clearInterval(iv);if(S.scanning)render()},300);
setTimeout(()=>{clearInterval(iv);S.scanning=false;S.img=scanImg();S.res={d:142,c:8.4,lpips:0.042,status:'Early Follicular Activation Detected',stage:'Week 4: Micro-Vellus Emergence'};S.tab='dashboard';render()},1800)}
function sendChat(e){e.preventDefault();const q=S.input.trim();if(!q)return;S.chat.push({s:'user',t:q});S.input='';S.focus=true;render();
setTimeout(()=>{const l=q.toLowerCase();let t='Based on your clinical care plan, your symptoms appear consistent with normal active ingredient adjustment.',b='Normal Progress';
if(/burning|rash|severe/.test(l)){t='WARNING: Your reported symptoms indicate potential severe contact dermatitis or skin barrier disruption. Please pause product application immediately. I am escalating your profile to a Be Bodywise dermatologist for urgent teleconsultation review.';b='Urgent Doctor Escalation Triggered'}
else if(/purging|acne|pimple/.test(l)){t='Rhea, experiencing mild acne breakouts during Weeks 2-3 of Niacinamide or Salicylic Acid application is normal skin purging. Active ingredients accelerate cellular turnover, pushing micro-comedones to the surface. Continue application; purging subsides by Week 4.';b='Expected Skin Purging Phase'}
else if(/shedding|hair fall|loss/.test(l)){t='Ananya, initial hair shedding during Weeks 2-4 of Redensyl + Procapil application is a positive clinical indicator. Early telogen hair strands shed to make room for stronger, denser anagen growth phases. Your scalp scan verifies early follicular activation.';b='Anagen Phase Transition'}
S.chat.push({s:'ai',t,b});render()},800)}
function exportRec(){S.exportJson=JSON.stringify({exportedAt:new Date().toISOString(),consentGranted:S.consent,scanResults:S.res,triageLog:S.chat},null,2);render()}
function del(){S.deleted=true;S.img=null;S.res=null;S.exportJson=null;S.chat=[];S.consent=false;render()}
render();
</script>
</body>
</html>
